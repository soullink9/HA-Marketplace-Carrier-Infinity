# The Marketplace's own checks (the HACS action): the catalog requires a passing run with nothing ignored.
# See https://contributors.home-assistant.io/marketplace/reference/validation/
name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

# The action is pinned to a commit, so a change pushed to its branch can't change what runs. Update the pin by hand.
permissions: {}

jobs:
  validate-hacs:
    name: Marketplace checks (HACS action)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main on 2026-11-22 (HACS publishes no current tags)
        with:
          category: integration
